
name: Construire Monster Empire APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "principal"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: unzip -o Monster_Empire_Android_Projet.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compiler APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Monster-Empire-APK
          path: app/build/outputs/apk/debug/app-debug.apk
